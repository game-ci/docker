name: Re-run failed tests

# Re-runs the failed jobs of a "Test" run once, on fresh runners.
# Hosted runners fail intermittently (Docker daemon not ready, full disk, stalled downloads,
# lost runners, timeouts), and a second attempt on another runner usually passes. A job that
# fails twice stays red. The first attempt's logs remain available on the run.
# A run that a person or a newer run cancelled is left alone.

on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed

permissions:
  actions: write

jobs:
  rerun:
    name: Re-run failed jobs once
    if: contains(fromJson('["failure", "cancelled"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          RUN_CREATED: ${{ github.event.workflow_run.created_at }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          set -euo pipefail
          # A re-run joins the Test concurrency group again, so re-running a superseded run would
          # cancel the newer run in that group. Leave the newer run to report instead. The group is
          # the PR for pull_request runs and the branch otherwise; runs from forks carry no PR
          # number, so a PR is matched by its head repository and branch. When that can't be
          # decided, skip the re-run: a missed retry is safer than cancelling a newer run.
          skip() {
            echo "Not re-running [run $RUN_ID]($RUN_URL): $1" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          # Runs from forks may wait for approval first: that attempt ends as "action_required"
          # without running a job, so the first attempt that ran jobs can be a later one.
          for ((attempt = 1; attempt < RUN_ATTEMPT; attempt++)); do
            earlier=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$attempt" --jq .conclusion)
            if [ "$earlier" != action_required ]; then
              skip "attempt $RUN_ATTEMPT is a re-run of attempt $attempt, which ran jobs"
            fi
          done
          if [ "$RUN_CONCLUSION" = cancelled ]; then
            # Lost runners and timeouts cancel single jobs that had started. A person or a newer
            # run cancels the whole run: jobs that had not started yet, and annotations naming why.
            cancelled_jobs=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=30" --paginate \
              --jq '.jobs[] | select(.conclusion == "cancelled") | "\(.id) \(.steps | length)"')
            while read -r job_id step_count; do
              [ -n "$job_id" ] || continue
              if [ "$step_count" -eq 0 ]; then
                skip "job $job_id was cancelled before it started, so the run was cancelled as a whole"
              fi
              reasons=$(gh api "repos/$REPOSITORY/check-runs/$job_id/annotations?per_page=100" --paginate \
                --jq '.[].message | select(test("^The run was canceled by|higher priority waiting request"))')
              reason=${reasons%%$'\n'*}
              if [ -n "$reason" ]; then
                skip "job $job_id was cancelled on purpose: $reason"
              fi
            done <<< "$cancelled_jobs"
          fi
          if [ "$RUN_EVENT" = pull_request ]; then
            head="${HEAD_REPOSITORY%%/*}:$HEAD_BRANCH"
            open_prs=$(gh api -X GET "repos/$REPOSITORY/pulls" -f head="$head" -f state=open --jq length)
            if [ "$open_prs" -gt 1 ]; then
              skip "$open_prs open pull requests share $head, so their runs can't be told apart"
            fi
          fi
          runs_query=(-X GET "repos/$REPOSITORY/actions/workflows/$WORKFLOW_ID/runs"
            -f branch="$HEAD_BRANCH" -f created=">=$RUN_CREATED")
          # GitHub returns at most 1,000 results for a filtered search, even when paginating
          total_runs=$(gh api "${runs_query[@]}" -f per_page=1 --jq .total_count)
          if [ "$total_runs" -gt 1000 ]; then
            skip "$total_runs runs on $HEAD_BRANCH since it, more than GitHub can list"
          fi
          newer_runs=$(gh api "${runs_query[@]}" -f per_page=100 --paginate \
            --jq ".workflow_runs[] | select(.id > $RUN_ID
              and ((.event == \"pull_request\") == (\"$RUN_EVENT\" == \"pull_request\"))
              and .head_repository.full_name == \"$HEAD_REPOSITORY\") | .html_url")
          newer_run=${newer_runs%%$'\n'*}
          if [ -n "$newer_run" ]; then
            skip "it is superseded by $newer_run"
          fi
          failed_jobs=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs?per_page=30" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled")
              | "- \(.name) (\(.conclusion)): \([.steps[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .name] | join(", "))"')
          {
            echo "### Re-running failed jobs of [run $RUN_ID]($RUN_URL)"
            echo
            echo "${failed_jobs:-No failed jobs listed.}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          gh run rerun "$RUN_ID" --failed --repo "$REPOSITORY"
          echo "Requested attempt $((RUN_ATTEMPT + 1)) for run $RUN_ID"
